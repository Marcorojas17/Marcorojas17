name: SYCRO CI

on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      
      # --- API CHECKS ---
      - name: Install, Audit & Build API
        run: cd apps/api && npm ci && npm audit --audit-level=high && npx tsc --noEmit && npm run build
      
      # --- DOCKER SMOKE TEST ---
      - name: Build Docker Image
        run: docker build -t sycro-api ./apps/api
      - name: Run Docker Container
        run: docker run -d --name sycro-api -p 3000:3000 sycro-api
      - name: Wait and Test Health
        run: sleep 5 && curl --fail http://127.0.0.1:3000/health || (docker logs sycro-api && exit 1)
      - name: Cleanup Docker
        run: docker rm -f sycro-api

      # --- WEB CHECKS ---
      - name: Install, Audit & Build Web
        run: cd apps/web && npm ci && npm audit --audit-level=high && npm run build
