<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYCRO VALDOVINOS | MCP Test</title>
    <style>
        body { background-color: #0B0E14; color: #E6EDF3; font-family: monospace; padding: 50px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #22d3ee; text-align: center; }
        .card { border: 1px solid #1f6feb; padding: 20px; border-radius: 8px; width: 100%; max-width: 600px; margin-top: 20px; background: #0d1117; }
        input { width: 100%; padding: 10px; background: #050816; border: 1px solid #30363d; color: white; border-radius: 4px; margin-bottom: 10px; font-family: monospace; }
        button { width: 100%; padding: 10px; background: #22d3ee; color: #0B0E14; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #a855f7; color: white; }
        pre { background: #050816; padding: 15px; border-radius: 4px; overflow-x: auto; color: #7EE787; white-space: pre-wrap; margin-top: 15px; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <h1>SYCRO VALDOVINOS<br><span style="font-size: 0.5em; color: #8B949E;">Post-Quantum Trust Layer</span></h1>
    
    <div class="card">
        <h3>Probar Servidor MCP</h3>
        <p style="font-size: 12px; color: #8B949E;">Escribe un mensaje. El servidor MCP usará ML-DSA-87 para firmarlo criptográficamente.</p>
        <input type="text" id="msg" value="Contrato Legal NOM-151 - Valdovinos" placeholder="Escribe aquí tu mensaje...">
        <button onclick="signMessage()">Firmar Mensaje (MCP)</button>
        <pre id="result">Esperando acción...</pre>
    </div>

    <script>
        async function signMessage() {
            const msg = document.getElementById('msg').value;
            const resDiv = document.getElementById('result');
            resDiv.textContent = "⏳ Conectando con el nodo MCP...";
            resDiv.style.color = "#8B949E";

            try {
                const response = await fetch('/api/sign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await response.json();
                
                if (data.success) {
                    resDiv.textContent = data.result;
                    resDiv.style.color = "#7EE787";
                } else {
                    resDiv.textContent = "Error: " + data.error + "\n" + (data.details || "");
                    resDiv.style.color = "#ef4444";
                }
            } catch (err) {
                resDiv.textContent = "Error de conexión: " + err.message;
                resDiv.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
