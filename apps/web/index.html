<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYCRO VALDOVINOS | Secure Trust Layer</title>
    <style>
        body { background-color: #0B0E14; color: #E6EDF3; font-family: monospace; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #0d1117; border-right: 1px solid #30363d; padding: 20px; }
        .logo { color: #22d3ee; font-size: 20px; font-weight: bold; margin-bottom: 30px; }
        .nav-item { padding: 10px; color: #8B949E; cursor: pointer; border-radius: 4px; margin-bottom: 5px; }
        .nav-item.active { background: #1f6feb; color: white; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { border: 1px solid #30363d; padding: 20px; border-radius: 8px; background: #0d1117; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; background: #050816; border: 1px solid #30363d; color: white; border-radius: 4px; margin-bottom: 10px; font-family: monospace; box-sizing: border-box;}
        button { padding: 10px 20px; background: #22d3ee; color: #0B0E14; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #a855f7; color: white; }
        .result-box { background: #050816; padding: 15px; border-radius: 4px; border: 1px solid #30363d; margin-top: 15px; display: none; }
        .label { color: #8B949E; font-size: 12px; }
        .value { color: #7EE787; word-break: break-all; margin-bottom: 10px; }
        .section { display: none; }
        .section.active { display: block; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #30363d; padding: 15px; flex-direction: row; overflow-x: auto; align-items: center; }
            .logo { margin-bottom: 0; margin-right: 20px; font-size: 16px; }
            .nav-item { margin-bottom: 0; margin-right: 10px; padding: 5px 10px; white-space: nowrap; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">SYCRO</div>
        <div class="nav-item active" onclick="showSection('live', this)">LIVE</div>
        <div class="nav-item" onclick="showSection('history', this)">HISTORY</div>
        <div class="nav-item" onclick="showSection('nodes', this)">NODES</div>
        <div class="nav-item" onclick="showSection('analysis', this)">ANALYSIS</div>
    </div>

    <div class="main">
        <div id="live" class="section active">
            <h2>Live Attestation</h2>
            <div class="card">
                <p style="color: #8B949E; font-size: 13px;">Secure flow: Document → SHA-256 Hash → MCP Sign.</p>
                <input type="text" id="document" value="Contrato Legal NOM-151 - Valdovinos" placeholder="Enter document text...">
                <button onclick="signMessage()">Sign Document</button>
                
                <div id="results" class="result-box">
                    <div class="label">Document Hash (SHA-256):</div>
                    <div id="res-hash" class="value">-</div>
                    
                    <div class="label">Timestamp:</div>
                    <div id="res-time" class="value">-</div>
                    
                    <div class="label">Signature (ML-DSA-87):</div>
                    <div id="res-sig" class="value" style="font-size: 10px;">-</div>
                </div>
            </div>
        </div>
        
        <!-- Otras secciones igual que antes -->
        <div id="history" class="section"><h2>History</h2><div class="card">Coming soon.</div></div>
        <div id="nodes" class="section"><h2>Nodes</h2><div class="card">Status: <span style="color: #7EE787;">● Active</span></div></div>
        <div id="analysis" class="section"><h2>Analysis</h2><div class="card">AI Risk Engine ready.</div></div>
    </div>

    <script>
        function showSection(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        async function signMessage() {
            const doc = document.getElementById('document').value;
            const btn = document.querySelector('button');
            btn.textContent = "Signing...";
            document.getElementById('results').style.display = 'none';

            try {
                const response = await fetch('/api/sign', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer SYCRO_SECRET_TOKEN' // <-- Autenticación
                    },
                    body: JSON.stringify({ document: doc })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('res-hash').textContent = data.documentHash;
                    document.getElementById('res-time').textContent = data.timestamp;
                    document.getElementById('res-sig').textContent = data.signature;
                    document.getElementById('results').style.display = 'block';
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Connection error: " + err.message);
            }
            btn.textContent = "Sign Document";
        }
    </script>
</body>
</html>
