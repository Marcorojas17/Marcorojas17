<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYCRO VALDOVINOS | Trust Layer</title>
    <style>
        body { background-color: #0B0E14; color: #E6EDF3; font-family: monospace; text-align: center; padding: 50px; }
        h1 { color: #22d3ee; }
        .card { border: 1px solid #1f6feb; padding: 20px; border-radius: 8px; display: inline-block; margin-top: 20px; }
        .status { color: #7EE787; font-weight: bold; }
    </style>
</head>
<body>
    <h1>SYCRO VALDOVINOS</h1>
    <p>Post-Quantum Trust Layer & AI Attestation</p>
    <div class="card">
        <h3>API Health Status</h3>
        <p id="api-status">Checking...</p>
    </div>
    <script>
        fetch('http://127.0.0.1:3000/health')
            .then(res => res.json())
            .then(data => {
                document.getElementById('api-status').innerHTML = `<span class="status">● ${data.status.toUpperCase()}</span> | ${data.service}`;
            })
            .catch(err => {
                document.getElementById('api-status').innerHTML = `<span style="color:red">● OFFLINE</span>`;
            });
    </script>
</body>
</html>
